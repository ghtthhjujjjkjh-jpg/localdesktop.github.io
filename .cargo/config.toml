[build]
rustflags = [
    "-C", "target-feature=+v8.2a,+neon,+fp-armv8,+crypto,+dotprod",
    "-C", "opt-level=3",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "embed-bitcode=yes",
]

target = "aarch64-linux-android"

[target.aarch64-linux-android]
linker = "aarch64-linux-android-clang"
ar = "aarch64-linux-android-ar"
rustflags = [
    "-C", "link-arg=-march=armv8.2-a",
    "-C", "link-arg=-mtune=cortex-a78",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,--gc-sections",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
split-debuginfo = "packed"
